<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>チケット詳細 - [[${issue.subject}]]</title>
    <!-- Bootstrap 5 CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons (編集・削除アイコン用) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container my-4" style="max-width: 900px;">

    <!-- ナビゲーション & アクションボタン -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <a th:href="@{/issues}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i> 一覧に戻る
        </a>
        <div>
            <!-- チケット編集ボタン -->
            <a th:href="@{/issues/{id}/edit(id=${issue.id})}" class="btn btn-warning btn-sm me-1">
                <i class="bi bi-pencil"></i> 編集
            </a>
            <!-- チケット削除ボタン -->
            <form th:action="@{/issues/{id}/delete(id=${issue.id})}" method="post" class="d-inline"
                  onclick="return confirm('本当にこのチケットを削除しますか？');">
                <button type="submit" class="btn btn-danger btn-sm">
                    <i class="bi bi-trash"></i> 削除
                </button>
            </form>
        </div>
    </div>

    <!-- メインカード -->
    <div class="card shadow-sm">
        
        <!-- ヘッダー (トラッカー名・チケットID・件名) -->
        <div class="card-header bg-white py-3">
            <div class="text-muted small mb-1">
                <span class="fw-bold" th:text="${issue.projectName}">プロジェクト名</span> / 
                <span class="badge bg-secondary" th:text="${issue.trackerName != null ? issue.trackerName : 'なし'}">Bug</span>
                <span class="ms-1">#[[${issue.id}]]</span>
            </div>
            <h3 class="card-title mb-0" th:text="${issue.subject}">ログイン画面でエラーが発生する不具合</h3>
        </div>

        <!-- ボディー -->
        <div class="card-body">
            
            <!-- 属性グリッド (2列表示) -->
            <div class="row bg-light p-3 rounded mb-4 border">
                <div class="col-md-6 mb-2">
                    <span class="text-muted">ステータス:</span>
                    <span class="badge bg-info text-dark ms-2" th:text="${issue.statusName != null ? issue.statusName : '未設定'}">New</span>
                </div>
                <div class="col-md-6 mb-2">
                    <span class="text-muted">優先度:</span>
                    <span class="fw-bold ms-2" th:text="${issue.priority}">Normal</span>
                </div>
                
                <div class="col-md-6 mb-2">
                    <span class="text-muted">担当者:</span>
                    <span class="ms-2" th:text="${issue.assigneeName != null ? issue.assigneeName : '未割り当て'}">山田 太郎</span>
                </div>
                <div class="col-md-6 mb-2">
                    <span class="text-muted">作成者:</span>
                    <span class="ms-2" th:text="${issue.authorName != null ? issue.authorName : 'システム'}">佐藤 花子</span>
                </div>

                <div class="col-md-6 mb-2">
                    <span class="text-muted">開始予定日:</span>
                    <span class="ms-2" th:text="${issue.startDate != null ? issue.startDate : '-'}">2026-09-01</span>
                </div>
                <div class="col-md-6 mb-2">
                    <span class="text-muted">期日:</span>
                    <span class="ms-2" th:text="${issue.dueDate != null ? issue.dueDate : '-'}">2026-09-15</span>
                </div>

                <div class="col-md-6">
                    <span class="text-muted">予定工数:</span>
                    <span class="ms-2" th:text="${issue.estimatedHours != null ? issue.estimatedHours + ' 時間' : '-'}">8.00 時間</span>
                </div>
                <div class="col-md-6">
                    <span class="text-muted">更新日時:</span>
                    <span class="ms-2 small text-muted" th:text="${#temporals.format(issue.updatedAt, 'yyyy-MM-dd HH:mm')}">2026-09-08 14:30</span>
                </div>
            </div>

            <!-- 詳細説明領域 -->
            <div class="mb-3">
                <h5 class="fw-bold border-bottom pb-2">説明</h5>
                <div class="p-3 bg-white border rounded" style="min-height: 120px; white-space: pre-wrap;"
                     th:text="${#strings.isEmpty(issue.description) ? '説明はありません。' : issue.description}">
                    ここにチケットの詳細説明テキストが表示されます。
                </div>
            </div>

        </div>

        <!-- フッター (作成日時) -->
        <div class="card-footer text-muted small bg-white text-end">
            作成日時: <span th:text="${#temporals.format(issue.createdAt, 'yyyy-MM-dd HH:mm')}">2026-09-01 10:00</span>
        </div>
    </div>

</div>

</body>
</html>
