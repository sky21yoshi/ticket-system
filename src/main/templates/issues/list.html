<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>チケット一覧</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>チケット一覧</h2>
        <a th:href="@{/issues/new}" class="btn btn-primary">＋ チケット作成</a>
    </div>

    <table class="table table-striped table-hover bg-white shadow-sm rounded">
        <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>プロジェクト</th>
                <th>トラッカー</th>
                <th>ステータス</th>
                <th>件名</th>
                <th>担当者</th>
                <th>優先度</th>
                <th>期日</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="issue : ${issues}">
                <td th:text="${issue.id}">1</td>
                <td th:text="${issue.projectName}">プロジェクトA</td>
                <td><span class="badge bg-secondary" th:text="${issue.trackerName}">Bug</span></td>
                <td><span class="badge bg-info text-dark" th:text="${issue.statusName}">New</span></td>
                <td>
                    <a th:href="@{/issues/{id}(id=${issue.id})}" th:text="${issue.subject}" class="fw-bold text-decoration-none">不具合件名</a>
                </td>
                <td th:text="${issue.assigneeName != null ? issue.assigneeName : '未割り当て'}">山田太郎</td>
                <td th:text="${issue.priority}">Normal</td>
                <td th:text="${issue.dueDate}">2026-09-30</td>
            </tr>
            <tr th:if="${#lists.isEmpty(issues)}">
                <td colspan="8" class="text-center text-muted py-4">チケットが存在しません。</td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
