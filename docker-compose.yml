version: '3.8'

# ネットワーク定義（DBアクセス用と外部アクセス用を分離）
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

# ボリューム定義（データ永続化用）
volumes:
  postgres_data:

services:
  # ----------------------------------------------------
  # DB サーバーコンテナ
  # ----------------------------------------------------
  db-server:
    image: postgres:15-alpine
    container_name: ticket-db-server
    restart: always
    environment:
      POSTGRES_DB: ticket_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    # 外部ホストへのポート開放を行わず、内部ネットワーク（backend-net）内でのみ疎通
    expose:
      - "5432"
    networks:
      - backend-net
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb.sql:/docker-entrypoint-initdb.d/initdb.sql # 初期スクリプト実行用
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticket_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # App サーバーコンテナ (Spring Boot)
  # ----------------------------------------------------
  app-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticket-app-server
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-server:5432/ticket_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    networks:
      - frontend-net
      - backend-net # DBサーバーと通信するために所属
    depends_on:
      db-server:
        condition: service_healthy # DB起動確認後にアプリを立ち上げる
