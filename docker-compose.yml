version: '3.8'

services:
  # ==========================================
  # 1. データベースサービス (PostgreSQL 16)
  # ==========================================
  db:
    image: postgres:16-alpine
    container_name: ticket-db
    environment:
      POSTGRES_DB: ticket_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 初回起動時にDDLと初期データを自動実行
      - ./initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticket_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ==========================================
  # 2. バックエンド API (Spring Boot 3 / Java 21)
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticket-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ticket_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: secretpassword
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  # ==========================================
  # 3. フロントエンド (Node.js / Express)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ticket-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8081
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data: